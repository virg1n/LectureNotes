[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturenotes"
version = "0.1.0"
description = "Harness-guided small-LM agent that writes LaTeX lecture notes, code-generated figures and cheat sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "jinja2>=3.1",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pymupdf>=1.23",
  "python-pptx>=0.6.21",
  "pillow>=10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.51",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=2.20",
]
deepspeed = ["deepspeed>=0.15"]
teacher = ["anthropic>=0.70"]
data = ["datasets>=2.20", "huggingface_hub>=0.24"]
dev = ["pytest>=8"]

[project.scripts]
lecturenotes = "lecturenotes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecturenotes = ["latex/templates/*", "eval/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "latex: needs a working pdflatex",
  "train: CPU training smoke tests (opt-in via LN_TEST_TRAIN=1)",
]
